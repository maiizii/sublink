{% extends "base.html" %}

{% block content %}
<div class="theme-layout">
  <section class="theme-shell">
    <div class="theme-shell__body theme-shell__body--center">
      <section class="theme-card theme-card--narrow">
        {% set zh_password = get_translations('admin.password', locale='zh-CN') %}
        <div class="theme-card__header theme-card__header--center">
            <h2
              class="theme-card__title"
              data-locale-original="{{ zh_password['title'] }}"
            >
              {{ _('admin.password.title') }}
            </h2>
            <!-- zh-CN title: {{ zh_password['title'] }} -->
            <p class="theme-card__subtitle">
              {{ _('admin.password.subtitle') }}
            </p>
        </div>
        <div class="theme-card__body">
            <form
              class="theme-form"
              action="/api/users/me/password"
              method="post"
              hx-post="/api/users/me/password"
              hx-trigger="submit"
              hx-target="#password-feedback"
              hx-swap="innerHTML"
              data-reset-on-success="true"
            >
              <div class="theme-form__grid theme-form__grid--single">
                <div class="theme-field theme-field--mobile-condensed">
                  <label for="current_password" class="theme-label"
                    >{{ _('admin.labels.currentPassword') }} *</label
                  >
                  <input
                    id="current_password"
                    name="current_password"
                    type="password"
                    required
                    class="theme-input"
                    autocomplete="current-password"
                  />
                </div>
                <div class="theme-field theme-field--mobile-condensed">
                  <label for="new_password" class="theme-label"
                    >{{ _('admin.labels.newPassword') }} *</label
                  >
                  <input
                    id="new_password"
                    name="new_password"
                    type="password"
                    minlength="6"
                    required
                    class="theme-input"
                    autocomplete="new-password"
                  />
                </div>
                <div class="theme-field theme-field--mobile-condensed">
                  <label for="confirm_password" class="theme-label"
                    >{{ _('admin.labels.confirmNewPassword') }} *</label
                  >
                  <input
                    id="confirm_password"
                    name="confirm_password"
                    type="password"
                    minlength="6"
                    required
                    class="theme-input"
                    autocomplete="new-password"
                  />
                </div>
              </div>
              <div class="theme-form__footer theme-form__footer--center theme-form__footer--balanced">
                <button type="submit" class="theme-button theme-button--solid">
                  {{ _('admin.buttons.updatePassword') }}
                </button>
                <a href="/admin" class="theme-button theme-button--ghost"
                  >{{ _('admin.buttons.returnToDashboard') }}</a
                >
              </div>
            </form>
        </div>
        <div
          id="password-feedback"
          class="theme-feedback"
          role="status"
          aria-live="polite"
        ></div>
      </section>
    </div>
  </section>
</div>
{% endblock %}
