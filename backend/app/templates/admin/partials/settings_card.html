<section class="theme-card" id="site-settings-card">
  <div class="theme-card__header">
    <h2 class="theme-card__title">站点设置</h2>
    <p class="theme-card__subtitle">
      配置基础域名、短链生成规则与品牌资源。
    </p>
  </div>
  <div class="theme-card__body">
    {% if settings_feedback_html %}
    <div class="theme-feedback" role="status">{{ settings_feedback_html|safe }}</div>
    {% endif %}
    <form
      class="theme-form"
      action="/api/settings"
      method="post"
      hx-put="/api/settings"
      hx-trigger="submit"
      hx-target="closest section"
      hx-swap="outerHTML"
    >
      <div class="theme-form__grid theme-form__grid--two-fixed">
        <div class="theme-field theme-field--mobile-condensed">
          <label for="site_domain" class="theme-label">管理域名 *</label>
          <input
            id="site_domain"
            name="site_domain"
            type="text"
            required
            class="theme-input theme-input--wide"
            placeholder="如 yet.la"
            value="{{ site_settings.site_domain }}"
          />
          <p class="theme-hint">仅输入域名，无需协议。用于限制短链入口与界面展示。</p>
        </div>
        <div class="theme-field theme-field--mobile-condensed">
          <label for="short_code_length" class="theme-label">短链默认长度 *</label>
          <input
            id="short_code_length"
            name="short_code_length"
            type="number"
            min="3"
            max="64"
            required
            class="theme-input theme-input--compact"
            value="{{ site_settings.short_code_length }}"
          />
          <p class="theme-hint">用于自动生成短链编码，可随时调整。</p>
        </div>
        <div class="theme-field theme-form__span-full theme-field--mobile-condensed">
          <label for="short_link_path" class="theme-label">短链路径前缀 *</label>
          <input
            id="short_link_path"
            name="short_link_path"
            type="text"
            required
            class="theme-input theme-input--wide"
            placeholder="如 / 或 /r/"
            value="{{ site_settings.short_link_path }}"
          />
          <p class="theme-hint">访问短链时的路径前缀，例如 /r/ 将生成 {{ short_link_prefix }}code。</p>
        </div>
        <div class="theme-field theme-form__span-full theme-field--mobile-condensed">
          <label for="logo_url" class="theme-label">Logo 图片地址 *</label>
          <input
            id="logo_url"
            name="logo_url"
            type="url"
            required
            class="theme-input theme-input--wide"
            placeholder="https://example.com/logo.png"
            value="{{ site_settings.logo_url }}"
          />
        </div>
        <div class="theme-field theme-form__span-full theme-field--mobile-condensed">
          <label for="icon_url" class="theme-label">网站 Icon 地址 *</label>
          <input
            id="icon_url"
            name="icon_url"
            type="url"
            required
            class="theme-input theme-input--wide"
            placeholder="https://example.com/favicon.png"
            value="{{ site_settings.icon_url }}"
          />
        </div>
      </div>
      <div class="theme-form__footer theme-form__footer--center">
        <button type="submit" class="theme-button theme-button--solid">
          保存设置
        </button>
      </div>
    </form>
  </div>
</section>
