{% if subdomains %}
<table class="theme-table">
  <thead>
    <tr>
      <th scope="col">子域</th>
      <th scope="col" class="theme-table__col-target">目标地址</th>
      <th scope="col">状态码</th>
      <th scope="col">访问次数</th>
      <th scope="col">创建时间</th>
      {% if show_user_column %}
      <th scope="col">用户</th>
      {% endif %}
      <th scope="col" class="theme-table__col-actions">
        <span class="theme-table__col-actions-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="5" cy="12" r="1.8"></circle>
            <circle cx="12" cy="12" r="1.8"></circle>
            <circle cx="19" cy="12" r="1.8"></circle>
          </svg>
        </span>
        <span class="sr-only">操作</span>
      </th>
    </tr>
  </thead>
  <tbody>
    {% for item in subdomains %}
    {% include "admin/partials/subdomain_row.html" %}
    {% endfor %}
  </tbody>
</table>
{% else %}
<div class="theme-table__empty">
  暂无子域配置，可通过上方表单或 <code>/api/subdomains</code> 接口创建。
</div>
{% endif %}
