<tr id="user-row-{{ item.id }}" class="theme-table__row theme-table__row--editing">
  <td colspan="5" class="theme-table__cell">
    <form
      class="theme-form"
      hx-put="/api/users/{{ item.id }}"
      hx-target="#user-feedback"
      hx-swap="innerHTML"
      data-success-event="refresh-users"
    >
      <div class="theme-form__grid theme-form__grid--two-fixed">
        <div class="theme-form__grid theme-form__grid--user-identity theme-form__span-full">
          <div class="theme-field theme-field--mobile-condensed">
            <label for="edit-username-{{ item.id }}" class="theme-label"
              >{{ _('admin.labels.username') }}</label
            >
            <input
              id="edit-username-{{ item.id }}"
              name="username"
              type="text"
              required
              value="{{ item.username }}"
              class="theme-input theme-input--wide"
              autocomplete="off"
              spellcheck="false"
              pattern="^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$"
              title="{{ _('admin.validation.slugPattern') }}"
            />
          </div>
          <div class="theme-field theme-field--mobile-condensed">
            <label for="edit-email-{{ item.id }}" class="theme-label"
              >{{ _('admin.labels.email') }}</label
            >
            <input
              id="edit-email-{{ item.id }}"
              name="email"
              type="email"
              required
              value="{{ item.email }}"
              class="theme-input theme-input--wide"
            />
          </div>
          <div class="theme-field">
            <label for="edit-role-{{ item.id }}" class="theme-label"
              >{{ _('admin.labels.permissions') }}</label
            >
            <select
              id="edit-role-{{ item.id }}"
              name="is_admin"
              class="theme-input theme-input--compact"
            >
              <option value="0" {% if not item.is_admin %}selected{% endif %}>
                {{ _('admin.roles.standard') }}
              </option>
              <option value="1" {% if item.is_admin %}selected{% endif %}>
                {{ _('admin.roles.admin') }}
              </option>
            </select>
          </div>
        </div>
        <div class="theme-field theme-field--mobile-condensed">
          <label for="edit-password-{{ item.id }}" class="theme-label"
            >{{ _('admin.labels.newPassword') }}</label
          >
          <input
            id="edit-password-{{ item.id }}"
            name="password"
            type="password"
            minlength="6"
            class="theme-input theme-input--wide"
            placeholder="{{ _('admin.placeholders.passwordOptional') }}"
          />
        </div>
        <div class="theme-field theme-field--mobile-condensed">
          <label for="edit-password-confirm-{{ item.id }}" class="theme-label"
            >{{ _('admin.labels.confirmNewPassword') }}</label
          >
          <input
            id="edit-password-confirm-{{ item.id }}"
            name="password_confirm"
            type="password"
            minlength="6"
            class="theme-input theme-input--wide"
            placeholder="{{ _('admin.placeholders.passwordConfirm') }}"
          />
        </div>
      </div>
      <div class="theme-form__footer">
        <p class="theme-helper">{{ _('admin.helpers.updateUser') }}</p>
        <div class="theme-form__actions">
          <button
            type="button"
            class="theme-button theme-button--ghost theme-button--sm"
            hx-get="/admin/users/{{ item.id }}/row"
            hx-target="closest tr"
            hx-swap="outerHTML"
          >
            {{ _('admin.buttons.cancel') }}
          </button>
          <button type="submit" class="theme-button theme-button--solid theme-button--sm">
            {{ _('admin.buttons.save') }}
          </button>
        </div>
      </div>
    </form>
  </td>
</tr>
