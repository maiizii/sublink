{% extends "base.html" %}

{% block content %}
<style>
  @media (min-width: 1024px) {
    .theme-shell__body--auth {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: clamp(24rem, 60vh, 32rem);
    }
  }

  @media (min-width: 1536px) {
    .theme-shell__body--auth {
      min-height: clamp(26rem, 58vh, 36rem);
    }
  }
</style>
<div class="theme-layout">
  <section class="theme-shell">
    <div class="theme-shell__body theme-shell__body--center theme-shell__body--auth">
      <section class="theme-card theme-card--narrow theme-card--auth">
        <div class="theme-card__header theme-card__header--center">
          <h2 class="theme-card__title">登录 {{ site_settings.site_domain }} 管理后台</h2>
          <p class="theme-card__subtitle">输入账号与密码</p>
        </div>
        <div class="theme-card__body">
          <form
            class="theme-form theme-form--login"
            action="/admin/login{% if redirect_target %}?next={{ redirect_target|urlencode }}{% endif %}"
            method="post"
          >
            <div class="theme-field">
              <label for="username" class="theme-label">
                <span class="theme-label__text">账号</span>
                <span class="theme-label__marker">*</span>
              </label>
              <input
                id="username"
                name="username"
                type="text"
                required
                class="theme-input"
                autocomplete="username"
                spellcheck="false"
                value="{{ username_value }}"
                pattern="^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$"
                title="仅允许小写字母、数字或连字符，首尾需为字母或数字"
              />
            </div>
            <div class="theme-field">
              <label for="password" class="theme-label">
                <span class="theme-label__text">密码</span>
                <span class="theme-label__marker">*</span>
              </label>
              <input
                id="password"
                name="password"
                type="password"
                required
                class="theme-input"
                autocomplete="current-password"
              />
            </div>
            <div class="theme-form__footer theme-form__footer--center">
              <button type="submit" class="theme-button theme-button--solid theme-button--block">
                登录
              </button>
            </div>
          </form>
          {% if login_error %}
          <div class="theme-login-feedback" role="alert">{{ login_error }}</div>
          {% endif %}
        </div>
      </section>
    </div>
  </section>
</div>
{% endblock %}
